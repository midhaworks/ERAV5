<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0B0D12"/>
  <rect x="72" y="258" width="238" height="168" rx="10" fill="#151B27" stroke="#2A3242"/>
  <rect x="346" y="258" width="238" height="168" rx="10" fill="#151B27" stroke="#2A3242"/>
  <rect x="620" y="258" width="238" height="168" rx="10" fill="#151B27" stroke="#2A3242"/>
  <rect x="894" y="258" width="238" height="168" rx="10" fill="#151B27" stroke="#2A3242"/>
  <text x="72" y="86" fill="#EAEEF6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="800">Four small experiments.</text>
  <text x="72" y="142" fill="#EAEEF6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="800">Four neural-network truths.</text>
  <text x="72" y="196" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22">Activations, nonlinear depth, embeddings, and generalization - proved in pure NumPy.</text>
  <text x="94" y="304" fill="#F0C070" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700">ACTIVATIONS</text>
  <text x="94" y="348" fill="#EAEEF6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="750">54% to 100%</text>
  <text x="94" y="386" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">A ReLU hidden layer bends</text>
  <text x="94" y="410" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">the decision boundary.</text>
  <text x="368" y="304" fill="#F0C070" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700">DEPTH</text>
  <text x="368" y="348" fill="#EAEEF6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="750">5 linear = 1</text>
  <text x="368" y="386" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">Without nonlinearity, stacked</text>
  <text x="368" y="410" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">layers collapse to one map.</text>
  <text x="642" y="304" fill="#F0C070" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700">EMBEDDINGS</text>
  <text x="642" y="348" fill="#EAEEF6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="750">Similarity emerges</text>
  <text x="642" y="386" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">Next-token prediction pulls</text>
  <text x="642" y="410" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">related tokens together.</text>
  <text x="916" y="304" fill="#F0C070" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700">DATA</text>
  <text x="916" y="348" fill="#EAEEF6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="750">Gap closes</text>
  <text x="916" y="386" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">More samples reduce</text>
  <text x="916" y="410" fill="#AAB4C6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">memorization brittleness.</text>
  <circle cx="86" cy="548" r="7" fill="#5B7BE8"/>
  <circle cx="105" cy="548" r="7" fill="#E0574A"/>
  <text x="126" y="555" fill="#F0C070" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">neural-network first principles - interactive pure-NumPy proofs</text>
</svg>
